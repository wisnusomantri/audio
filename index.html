<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCH - Rekam Reading Practice</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #F5F7FB; color: #1e293b; margin: 0; padding: 0;
    display: flex; justify-content: center; min-height: 100vh;
  }
  .card {
    width: 100%; max-width: 480px; background: #fff; margin: 24px 16px;
    border-radius: 20px; box-shadow: 0 10px 30px rgba(20,47,110,.12);
    padding: 24px; height: fit-content;
  }
  h1 { font-size: 16px; margin: 0 0 4px; color: #142F6E; }
  p.sub { font-size: 12px; color: #64748b; margin: 0 0 20px; }
  .box { background: #F0F6FF; border: 1px solid #DCEAFE; border-radius: 12px; padding: 12px; font-size: 12px; margin-bottom: 16px; }
  label { display: block; font-size: 11px; font-weight: 600; color: #475569; margin-bottom: 4px; }
  input, textarea {
    width: 100%; padding: 9px 10px; border: 1px solid #e2e8f0; border-radius: 10px;
    font-size: 13px; margin-bottom: 12px; font-family: inherit;
  }
  textarea { resize: vertical; min-height: 60px; }
  button {
    width: 100%; padding: 11px; border: none; border-radius: 10px;
    font-size: 13px; font-weight: 700; cursor: pointer; margin-bottom: 10px;
  }
  #btnStart { background: #1957DE; color: #fff; }
  #btnStop { background: #dc2626; color: #fff; }
  #btnSend { background: #059669; color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #timer { text-align: center; font-size: 28px; font-weight: 800; color: #1442B0; margin: 12px 0; font-variant-numeric: tabular-nums; }
  #status { font-size: 12px; text-align: center; padding: 8px; border-radius: 8px; margin-bottom: 12px; display: none; }
  .ok { background: #d1fae5; color: #065f46; }
  .err { background: #fee2e2; color: #991b1b; }
  audio { width: 100%; margin-bottom: 12px; }
  #recordSection, #detailSection { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>Rekam Reading Practice</h1>
  <p class="sub">Halaman ini di-hosting terpisah dari CCH agar izin mikrofon browser bisa berfungsi normal.</p>

  <div id="setupBox" class="box">
    Buka halaman ini lewat link yang berisi token & ID bacaan (dari menu Reading di CCH), atau isi manual di bawah kalau perlu.
  </div>

  <div id="status"></div>

  <label>Session Token</label>
  <input type="text" id="fToken" placeholder="Token sesi login CCH">

  <label>ID Bacaan</label>
  <input type="text" id="fReadingId" placeholder="Contoh: RD-20260814-101500">

  <div id="recordSection">
    <div id="timer">00:00</div>
    <button id="btnStart" onclick="startRec()">🎙️ Mulai Rekam</button>
    <button id="btnStop" onclick="stopRec()" disabled>⏹ Selesai Rekam</button>
  </div>

  <div id="detailSection">
    <audio id="preview" controls></audio>
    <label>Catatan Pemahaman (opsional)</label>
    <textarea id="fCatatan" placeholder="Ringkasan singkat isi bacaan..."></textarea>
    <button id="btnSend" onclick="sendToCCH()">📤 Kirim ke CCH</button>
  </div>
</div>

<script>
  // WAJIB DIISI: ganti dengan URL Web App Apps Script Anda (yang diakhiri /exec)
  const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxkwqARsk6ymXbmZODztnwK0rNYHTOL-M2XUqHx7-mn7OZgJWGz0zdxfY_FW7JF_V6r/exec';

  let mediaRecorder, mediaStream, chunks = [], startTime, timerInterval, finalBlob = null;

  // Ambil token & readingId dari query string kalau dibuka lewat link, contoh:
  // index.html?token=xxxx&id=RD-20260101-000000
  const params = new URLSearchParams(location.search);
  if (params.get('token')) document.getElementById('fToken').value = params.get('token');
  if (params.get('id')) document.getElementById('fReadingId').value = params.get('id');

  document.getElementById('recordSection').style.display = 'block';

  function showStatus(msg, type) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = type;
    el.style.display = 'block';
  }

  async function startRec() {
    chunks = [];
    finalBlob = null;
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      showStatus('Tidak bisa mengakses mikrofon: ' + (err && err.message ? err.message : err), 'err');
      return;
    }
    const preferredType = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg']
      .find(t => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
    mediaRecorder = preferredType ? new MediaRecorder(mediaStream, { mimeType: preferredType }) : new MediaRecorder(mediaStream);
    mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const mimeType = mediaRecorder.mimeType || 'audio/webm';
      finalBlob = new Blob(chunks, { type: mimeType });
      document.getElementById('preview').src = URL.createObjectURL(finalBlob);
      document.getElementById('detailSection').style.display = 'block';
      mediaStream.getTracks().forEach(t => t.stop());
    };
    mediaRecorder.start();
    startTime = Date.now();
    timerInterval = setInterval(updateTimer, 250);
    document.getElementById('btnStart').disabled = true;
    document.getElementById('btnStop').disabled = false;
    document.getElementById('status').style.display = 'none';
  }

  function updateTimer() {
    const sec = Math.floor((Date.now() - startTime) / 1000);
    const m = String(Math.floor(sec / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    document.getElementById('timer').textContent = m + ':' + s;
  }

  function stopRec() {
    clearInterval(timerInterval);
    document.getElementById('btnStart').disabled = false;
    document.getElementById('btnStop').disabled = true;
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  }

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  async function sendToCCH() {
    const token = document.getElementById('fToken').value.trim();
    const readingId = document.getElementById('fReadingId').value.trim();
    const catatan = document.getElementById('fCatatan').value.trim();
    const durasiDetik = Math.floor((Date.now() - startTime) / 1000);

    if (!token || !readingId) {
      showStatus('Session Token & ID Bacaan wajib diisi.', 'err');
      return;
    }
    if (!finalBlob) {
      showStatus('Belum ada rekaman untuk dikirim.', 'err');
      return;
    }
    if (WEBAPP_URL.indexOf('GANTI_DENGAN_URL_WEB_APP_ANDA') !== -1) {
      showStatus('WEBAPP_URL di kode belum diisi. Edit index.html dulu.', 'err');
      return;
    }

    const btn = document.getElementById('btnSend');
    btn.disabled = true;
    btn.textContent = '⏳ Mengirim...';

    try {
      const audioBase64 = await blobToBase64(finalBlob);
      const payload = {
        action: 'logReadingPracticeSessionExternal',
        token: token,
        id: readingId,
        durasiDetik: durasiDetik,
        catatan: catatan,
        audioBase64: audioBase64,
        audioMimeType: finalBlob.type || 'audio/webm'
      };

      // Content-Type text/plain sengaja dipakai supaya browser TIDAK mengirim preflight
      // OPTIONS request (Apps Script tidak menangani preflight) -- doPost() di Code.gs
      // tetap mem-parse body-nya sebagai JSON.
      const res = await fetch(WEBAPP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.success) {
        showStatus('✅ ' + data.message, 'ok');
        document.getElementById('detailSection').style.display = 'none';
      } else {
        showStatus('❌ ' + data.message, 'err');
      }
    } catch (err) {
      showStatus('Gagal mengirim: ' + (err && err.message ? err.message : err), 'err');
    } finally {
      btn.disabled = false;
      btn.textContent = '📤 Kirim ke CCH';
    }
  }
</script>
</body>
</html>
